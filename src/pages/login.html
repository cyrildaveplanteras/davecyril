<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <title>GoldenHope - Login</title>
  <script>
    // Renderer error trap: an uncaught error must surface (red banner + log file)
    // instead of a silent white screen. Loads before every other script.
    (function () {
      function log(msg) {
        try { if (window.api && window.api.logRendererError) window.api.logRendererError(msg); } catch (_) {}
      }
      function showBanner(text) {
        try {
          var b = document.getElementById('ghErrorBanner');
          if (!b) {
            b = document.createElement('div');
            b.id = 'ghErrorBanner';
            b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#DC2626;color:#fff;font:12px/1.4 Consolas,monospace;padding:10px 44px 10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;text-align:left;';
            var close = document.createElement('button');
            close.textContent = '\u2715';
            close.style.cssText = 'position:absolute;top:4px;right:6px;background:none;border:none;color:#fff;font-size:16px;cursor:pointer;';
            close.onclick = function () { b.remove(); };
            b.appendChild(close);
            (document.body || document.documentElement).appendChild(b);
          }
          var t = document.createElement('div');
          t.style.marginTop = '4px';
          t.textContent = text;
          b.appendChild(t);
          b.style.display = 'block';
        } catch (_) {}
      }
      window.addEventListener('error', function (e) {
        var m = (e && e.message) || 'Unknown script error';
        var src = (e && e.filename) || '';
        var line = (e && e.lineno) || '';
        var short = src.replace(/^.*[\\\/]/, '');
        log('[error] ' + m + ' @ ' + src + ':' + line);
        showBanner('Script error: ' + m + ' @ ' + short + ':' + line);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = (e && e.reason) || {};
        var msg = (r && r.message) ? r.message : String(r && r.stack || r) || 'Unhandled promise rejection';
        log('[rejection] ' + (r && r.stack || msg));
        showBanner('Promise error: ' + msg);
      });
    })();
  </script>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-container">
    <!-- LEFT BRANDING PANEL -->
    <div class="login-left">
      <div class="login-pattern-overlay"></div>
      <div class="login-wave-bg">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,400 C240,350 320,500 480,420 C640,340 800,520 960,440 C1120,360 1280,480 1440,400 L1440,900 L0,900 Z" fill="rgba(37,99,235,0.04)"/>
          <path d="M0,500 C240,440 320,580 480,510 C640,440 800,600 960,530 C1120,460 1280,560 1440,500 L1440,900 L0,900 Z" fill="rgba(37,99,235,0.03)"/>
          <path d="M0,600 C240,550 320,670 480,610 C640,550 800,690 960,630 C1120,570 1280,650 1440,600 L1440,900 L0,900 Z" fill="rgba(37,99,235,0.02)"/>
        </svg>
      </div>
      <div class="login-geo-line login-geo-line--1"></div>
      <div class="login-geo-line login-geo-line--2"></div>
      <div class="login-geo-line login-geo-line--3"></div>
      <div class="login-glow-orb login-glow-orb--1"></div>
      <div class="login-glow-orb login-glow-orb--2"></div>
      <div class="login-left-content">
        <div class="login-branding">
          <div class="login-logo-wrap">
            <div class="login-logo-ring"></div>
            <img src="../../assets/logo.png" alt="GoldenHope" onerror="this.style.display='none'" class="login-logo-img" loading="lazy">
          </div>
          <h1 class="login-brand-title">GOLDENHOPE</h1>
          <p class="login-brand-sub">Damayan Association and Support Inc.</p>
          <p class="login-brand-tag">"Efficient. Reliable. Secure."</p>
        </div>
        <div class="login-left-footer">
          <p>Version 3.0</p>
          <p>&copy; 2026 GoldenHope Management System</p>
        </div>
      </div>
    </div>

    <!-- RIGHT LOGIN PANEL -->
    <div class="login-right">
      <div class="login-card" id="loginCard">
        <div class="login-card-header">
          <h2>Welcome Back</h2>
          <p>Sign in to continue to the GoldenHope Management System</p>
        </div>

        <div class="login-error" id="loginError" role="alert"></div>

        <form id="loginForm" onsubmit="return false;" novalidate>
          <div class="login-field" id="usernameField">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autofocus aria-required="true" aria-label="Username">
            </div>
            <span class="login-field-error" id="usernameError" role="alert"></span>
          </div>

          <div class="login-field" id="passwordField">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" aria-required="true" aria-label="Password">
              <button class="password-toggle" id="togglePassword" type="button" tabindex="-1" aria-label="Show password">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="login-field-error" id="passwordError" role="alert"></span>
          </div>

          <div class="login-options">
            <label class="login-checkbox">
              <input type="checkbox" id="rememberMe" checked>
              <span class="login-checkbox-mark"></span>
              <span class="login-checkbox-label">Remember me</span>
            </label>
            <a href="#" class="login-forgot-link" id="forgotLink" tabindex="0" aria-label="Forgot password">Forgot password?</a>
          </div>

          <button class="login-btn" id="loginBtn" type="submit" aria-label="Sign in">
            <span class="login-btn-text">Sign In</span>
            <div class="login-btn-spinner">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
            </div>
          </button>
        </form>

        <div id="mustChangeSection" class="login-card-section" style="display:none">
          <div class="login-card-header">
            <h2>Set a New Password</h2>
            <p>Your password must be changed before you can continue.</p>
          </div>
          <div class="login-field">
            <label for="newPassword">New Password (min 8 chars, upper + lower + number)</label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
          </div>
          <div class="login-field">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="Repeat new password">
            </div>
          </div>
          <button class="login-btn" id="setPasswordBtn" type="button">Save &amp; Continue</button>
        </div>

        <div style="text-align:center;margin-top:16px">
          <button type="button" onclick="toggleDiagnose()" style="background:none;border:none;cursor:pointer;text-decoration:underline;color:#2563EB;font-size:13px">Having trouble signing in? Diagnose</button>
        </div>
        <div id="diagnosePanel" style="display:none;margin-top:14px;text-align:left">
          <textarea id="diagnoseReport" readonly placeholder="Click Diagnose again or press Copy Report to send the details to your administrator." style="width:100%;height:200px;font:11px/1.4 Consolas,monospace;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;resize:vertical;white-space:pre-wrap"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button type="button" id="copyReportBtn" class="login-btn" style="flex:1;min-width:130px">Copy Report</button>
            <button type="button" id="resetAdminBtn" class="login-btn" style="flex:1;min-width:180px;background:#DC2626">Reset admin to 'admin'</button>
          </div>
          <div class="login-error" id="diagMsg" style="display:none;margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== DOM REFS =====
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const usernameField = document.getElementById('usernameField');
    const passwordField = document.getElementById('passwordField');
    const loginCard = document.getElementById('loginCard');

    // ===== ENTER KEY NAVIGATION =====
    usernameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') passwordInput.focus();
    });
    passwordInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      handleLogin();
    });

    // ===== PASSWORD VISIBILITY TOGGLE =====
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = toggleBtn.querySelector('.eye-icon');
    const eyeOffIcon = toggleBtn.querySelector('.eye-off-icon');

    toggleBtn.addEventListener('click', function() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.style.display = isPassword ? 'none' : '';
      eyeOffIcon.style.display = isPassword ? '' : 'none';
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });

    // ===== CLEAR FIELD ERRORS ON INPUT =====
    usernameInput.addEventListener('input', function() {
      usernameError.textContent = '';
      usernameError.style.display = 'none';
      usernameField.classList.remove('login-field--error');
      errorEl.style.display = 'none';
    });
    passwordInput.addEventListener('input', function() {
      passwordError.textContent = '';
      passwordError.style.display = 'none';
      passwordField.classList.remove('login-field--error');
      errorEl.style.display = 'none';
    });

    // ===== INPUT FOCUS EVENTS FOR ICON HIGHLIGHT =====
    document.querySelectorAll('.input-wrapper input').forEach(function(input) {
      input.addEventListener('focus', function() {
        this.closest('.input-wrapper').classList.add('input-wrapper--focused');
      });
      input.addEventListener('blur', function() {
        this.closest('.input-wrapper').classList.remove('input-wrapper--focused');
      });
    });

    // ===== FORGOT PASSWORD =====
    document.getElementById('forgotLink').addEventListener('click', function(e) {
      e.preventDefault();
      showError('Please contact your system administrator to reset your password.');
      loginCard.classList.remove('login-card--shake');
      void loginCard.offsetWidth;
      loginCard.classList.add('login-card--shake');
    });

    // ===== SHOW FIELD ERROR =====
    function showFieldError(fieldEl, errorEl, msg) {
      fieldEl.classList.add('login-field--error');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    // ===== SHOW GLOBAL ERROR =====
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    // ===== LOGIN HANDLER (preserved logic, enhanced UI) =====
    async function handleLogin() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const userAgent = navigator.userAgent || '';

      // Clear previous errors
      usernameError.textContent = '';
      usernameError.style.display = 'none';
      usernameField.classList.remove('login-field--error');
      passwordError.textContent = '';
      passwordError.style.display = 'none';
      passwordField.classList.remove('login-field--error');
      errorEl.style.display = 'none';
      loginCard.classList.remove('login-card--shake');

      // Validation
      let hasError = false;
      if (!username) {
        showFieldError(usernameField, usernameError, 'Username is required.');
        hasError = true;
      }
      if (!password) {
        showFieldError(passwordField, passwordError, 'Password is required.');
        hasError = true;
      }
      if (hasError) return;

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      try {
        // Time out instead of spinning forever when the DB never responds.
        const result = await Promise.race([
          window.api.login(username, password),
          new Promise((_, reject) => setTimeout(() => reject(new Error('LOGIN_TIMEOUT')), 25000))
        ]);
        if (result.success) {
          const userData = { ...result.user, mustChangePassword: result.mustChangePassword || false };
          sessionStorage.setItem('currentUser', JSON.stringify(userData));
          try { await window.api.logActivity(result.user.id, 'Login', 'User ' + result.user.username + ' logged in successfully', '', userAgent, 'Success'); } catch (_) {}
          if (userData.mustChangePassword) {
            pendingUser = result.user;
            pendingCurrentPassword = password;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('mustChangeSection').style.display = 'block';
            document.getElementById('newPassword').focus();
          } else {
            window.location.href = 'main.html';
          }
        } else {
          try { await window.api.logActivity(null, 'Login', 'Failed login attempt for user "' + username + '": ' + result.error, '', userAgent, 'Failed'); } catch (_) {}
          showError(result.error || 'Invalid username or password.');
          loginCard.classList.add('login-card--shake');
          loginBtn.disabled = false;
          loginBtn.classList.remove('loading');
          if (passwordInput) {
            passwordInput.value = '';
            passwordInput.focus();
          }
        }
      } catch (err) {
        let message = 'Connection error. Please try again.';
        if (err && err.message === 'LOGIN_TIMEOUT') {
          message = 'Login is not responding. The database may be down or starting up. Please wait a minute and try again.';
        }
        try { await window.api.logActivity(null, 'Login', 'Failed login attempt for user "' + username + '": ' + message, '', userAgent, 'Failed'); } catch (_) {}
        showError(message);
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
      }
    }
  // ===== DIAGNOSE LOGIN PROBLEMS =====
    let pendingUser = null;
    let pendingCurrentPassword = null;

    async function toggleDiagnose() {
      const panel = document.getElementById('diagnosePanel');
      const isHidden = panel.style.display === 'none';
      panel.style.display = isHidden ? 'block' : 'none';
      if (isHidden) await runDiagnose();
    }

    async function runDiagnose() {
      const ta = document.getElementById('diagnoseReport');
      const msgEl = document.getElementById('diagMsg');
      msgEl.style.display = 'none';
      function fail(msg) {
        ta.value = 'Diagnose failed: ' + msg + '\n\nThis is also being logged. Send this text to your administrator.';
        msgEl.textContent = 'Could not complete the check: ' + msg;
        msgEl.style.display = 'block';
      }
      try {
        const report = await window.api.diagnose();
        if (!report) { fail('empty response'); return; }
        const r = {
          AppVersion: report.appVersion || '?',
          Packaged: report.packaged === true ? 'yes' : 'no',
          DBEndpoint: (report.endpoint ? report.endpoint.user + '@' + report.endpoint.host + ':' + report.endpoint.port + '/' + report.endpoint.database + ' (password ' + report.endpoint.password + ')' : 'unknown'),
          PG_BinDir: report.pgBinDir || '',
          PG_DataDir: report.pgDataDir || '',
          DBReachable: report.reachable ? 'YES' : 'NO',
          ConnectError: report.connectError || '',
          UserCount: report.usersCount,
          Users: (report.adminUsers || []).map(function (u) {
            return '  #' + u.Id + ' "' + (u.Username || '') + '" role=' + (u.Role || '') + ' active=' + u.IsActive + ' locked=' + u.IsLocked + ' mustChange=' + u.MustChangePassword + ' hash=' + (u.hashScheme || '?') + ' lastLogin=' + (u.LastLogin || 'never');
          }).join('\n'),
          RecentFailedAttempts: (report.loginAttempts || []).map(function (a) {
            return '  "' + a.username + '" attempts=' + a.attempt_count + ' lockedUntil=' + (a.locked_until || 'none');
          }).join('\n') || '  none'
        };
        const lines = [];
        for (const k in r) lines.push(k + ': ' + r[k]);
        ta.value = lines.join('\n');
      } catch (err) {
        fail((err && err.message) || String(err));
      }
    }

    document.getElementById('copyReportBtn').addEventListener('click', function () {
      const ta = document.getElementById('diagnoseReport');
      if (!ta.value) { runDiagnose(); return; }
      ta.select();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(function () { showError('Report copied. Paste it to your administrator.'); }).catch(function () { document.execCommand('copy'); showError('Report copied to clipboard.'); });
        } else {
          document.execCommand('copy');
          showError('Report copied to clipboard.');
        }
      } catch (_) {
        showError('Copy failed. Select all the text above manually.');
      }
    });

    document.getElementById('resetAdminBtn').addEventListener('click', async function () {
      const msgEl = document.getElementById('diagMsg');
      if (!window.confirm('This resets the admin account to username "admin" / password "admin" and forces a password change on next login. Continue?')) return;
      try {
        const res = await window.api.resetDefaultLogin(true);
        msgEl.style.display = 'block';
        msgEl.textContent = res.success
          ? 'Admin has been reset. Sign in with admin / admin (you will be asked to set a new password).'
          : 'Reset failed: ' + (res.error || 'unknown error');
        await runDiagnose();
      } catch (err) {
        msgEl.style.display = 'block';
        msgEl.textContent = 'Reset failed: ' + ((err && err.message) || String(err));
      }
    });

    // ===== MUST-CHANGE PASSWORD =====
    document.getElementById('setPasswordBtn').addEventListener('click', async function () {
      const np = document.getElementById('newPassword').value;
      const cp = document.getElementById('confirmPassword').value;
      const msgEl = document.getElementById('loginError');
      msgEl.style.display = 'none';
      if (np !== cp) { showError('Passwords do not match.'); return; }
      if (np.length < 8 || !/[A-Z]/.test(np) || !/[a-z]/.test(np) || !/[0-9]/.test(np)) {
        showError('Password must be at least 8 characters with uppercase, lowercase and a number.');
        return;
      }
      const btn = document.getElementById('setPasswordBtn');
      btn.disabled = true;
      try {
        const res = await window.api.changePassword(pendingUser.id, pendingCurrentPassword, np);
        if (res.success) {
          const userData = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
          userData.mustChangePassword = false;
          sessionStorage.setItem('currentUser', JSON.stringify(userData));
          window.location.href = 'main.html';
        } else {
          showError(res.error || 'Could not update password.');
          btn.disabled = false;
        }
      } catch (err) {
        showError((err && err.message) || 'Could not update password.');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
