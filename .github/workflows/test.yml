name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check JS
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/build-win.js
          for f in $(find src scripts -name '*.js'); do node --check "$f"; done

      - name: Package (unsigned test build)
        run: npx electron-builder --dir --config.win.signAndEditExecutable=false